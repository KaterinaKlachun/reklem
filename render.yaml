
services:
  - type: web
    name: reklem-laravel-docker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://reklem-laravel-docker.onrender.com
      - key: FRONTEND_URL
        value: https://reklem-laravel-docker.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-us-east-2.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.mgjyxgaiyngflmlfzoju
      - key: DB_PASSWORD
        value: root
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
