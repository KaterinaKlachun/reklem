services:
  - type: web
    name: reklem
    env: docker
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: "php-fpm"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-us-east-2.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.mgjyxgaiyngflmlfzoju
      - key: DB_PASSWORD
        value: root
